services:
  warp:
    image: dublok/cloudflare-warp:latest
    container_name: warp
    restart: always
    ports:
      - "40000:40000"                          # WARP instance 0 SOCKS5 proxy (Cloudflare IP)
      # - "40001:40001"                        # WARP instance 1 (when WARP_INSTANCES >= 2)
      # - "1080:1080"                          # GOST SOCKS5 WARP proxy (requires START_GOST=true)
      # - "1081:1081"                          # SOCKS5 Direct proxy (real IP)
      # - "8080:8080"                          # HTTP WARP proxy (Cloudflare IP)
      # - "8081:8081"                          # HTTP Direct proxy (real IP)
      # - "8388:8388"                          # Shadowsocks WARP proxy (for mobile VPN)
      # - "8389:8389"                          # Shadowsocks Direct proxy (for mobile VPN)
    environment:
      - START_GOST=false                        # start GOST aggregate proxies (default: false)
      # - WARP_INSTANCES=1                       # number of WARP instances (default: 1)
                                                  # each instance gets a unique Cloudflare IP
                                                  # traffic is round-robined across all instances
      # - WARP_LICENSE_KEY=your-key              # WARP+ license key (comma-separated for multiple)
      # - WARP_CONNECT_TIMEOUT=30                # max seconds to wait for WARP daemon
      # - PROXY_USER=myuser                      # proxy authentication username
      # - PROXY_PASS=mypassword                  # proxy authentication password
      # - PROXY_ALLOWED_IPS=192.168.1.0/24       # IP whitelist (comma-separated CIDRs)
      # - PROXY_MAX_CONN=10                      # max concurrent connections per IP
      # - PROXY_MAX_RPS=10                       # max requests per second per IP
      # - SS_METHOD=chacha20-ietf-poly1305       # Shadowsocks encryption method
    volumes:
      - warp-data:/var/lib/cloudflare-warp

volumes:
  warp-data:
