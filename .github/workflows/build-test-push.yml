name: Build, Test & Push

on:
  push:
  workflow_dispatch:

env:
  IMAGE_NAME: cloudflare-warp
  TEST_TAG: cloudflare-warp-test:latest

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image for testing (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.TEST_TAG }}
          build-args: |
            COMMIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Docker image for arm64 (verify only)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: false
          build-args: |
            COMMIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test default direct instance ports
        env:
          SKIP_BUILD: 'true'
          IMAGE_NAME: cloudflare-warp-test
          START_GOST: 'false'
        run: ./scripts/test-gost-toggle.sh

  push:
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Read Docker tags
        id: version
        run: |
          {
            echo 'tags<<EOF'
            jq -r --arg image "docker.io/${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}" \
              '.tags[] | "\($image):\(.)"' .version_v1.0.json
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build and push Docker Hub image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.version.outputs.tags }}
          build-args: |
            COMMIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
