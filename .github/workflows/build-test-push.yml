name: Build, Test & Push

on:
  push:
    paths:
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'entrypoint.sh'
      - 'start-warp-instance.sh'
      - 'scripts/**'
      - 'healthcheck/**'
      - '.github/workflows/build-test-push.yml'
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      start_gost:
        description: 'Start GOST aggregate proxies during tests'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

env:
  IMAGE_NAME: cloudflare-warp
  TEST_TAG: cloudflare-warp-test:latest
  START_GOST: ${{ github.event_name == 'workflow_dispatch' && inputs.start_gost || 'false' }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image for testing (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.TEST_TAG }}
          build-args: |
            COMMIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Docker image for arm64 (verify only)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: false
          build-args: |
            COMMIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test default direct instance ports
        if: env.START_GOST == 'false'
        env:
          SKIP_BUILD: 'true'
          IMAGE_NAME: cloudflare-warp-test
          START_GOST: 'false'
        run: ./scripts/test-gost-toggle.sh

      - name: Test GOST aggregate proxies
        if: env.START_GOST == 'true'
        env:
          SKIP_BUILD: 'true'
          IMAGE_NAME: cloudflare-warp-test
          START_GOST: 'true'
        run: ./scripts/test-gost-toggle.sh

  push:
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: docker.io/${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build and push Docker Hub image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            COMMIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
